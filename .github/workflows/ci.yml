name: CI

# Push to main only: this job runs on a self-hosted runner, so code from outside pull requests
# must never reach it. Pull requests are disabled on the repo as well.
on:
  push:
    branches: [main]

jobs:
  test:
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 2026-09-17: se agotó el cupo de GitHub Actions; todo corre en el runner de asuka-hub
        # (etiqueta `acer`). La pata windows-latest vuelve cuando haya un runner Windows en la PC.
        os: [acer]

    steps:
      - uses: actions/checkout@v4

      - name: Configure git identity (needed for git init in fixtures)
        # Env vars instead of `git config --global`: on a self-hosted runner --global rewrites
        # the machine owner's ~/.gitconfig.
        run: |
          {
            echo "GIT_AUTHOR_NAME=CI"; echo "GIT_AUTHOR_EMAIL=ci@example.com"
            echo "GIT_COMMITTER_NAME=CI"; echo "GIT_COMMITTER_EMAIL=ci@example.com"
          } >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run POSIX test suite
        if: runner.os != 'Windows'
        run: bash tests/run.sh

      - name: Run POSIX test suite (Git Bash)
        if: runner.os == 'Windows'
        shell: bash
        run: bash tests/run.sh

      - name: Run PowerShell test suite
        shell: pwsh
        run: ./tests/run.ps1
